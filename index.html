<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argument Logic Evaluator</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 18px;
    }

    textarea, input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #0066cc;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #output {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    #output h1, #output h2, #output h3 {
      margin-top: 0;
      color: #1a202c;
    }

    #output p {
      margin-bottom: 12px;
    }

    #output ul, #output ol {
      padding-left: 20px;
    }

    #output li {
      margin-bottom: 6px;
    }

    #output blockquote {
      margin: 12px 0;
      padding-left: 12px;
      border-left: 4px solid #0066cc;
      color: #4a5568;
    }
  </style>
</head>
<body>

  <h1>Argument Logic Evaluator</h1>

  <label for="apiKey">Gemini API Key (saved locally):</label>
  <input type="password" id="apiKey" placeholder="AIzaSy..." />

  <label for="opponentClaim">1. What argument is your opponent making?</label>
  <textarea id="opponentClaim"></textarea>

  <label for="steelman">2. Why is their argument strong or reasonable?</label>
  <textarea id="steelman"></textarea>

  <label for="critique">3. Where do you think their argument is flawed?</label>
  <textarea id="critique"></textarea>

  <label for="betterIdea">4. Why is your alternative idea better?</label>
  <textarea id="betterIdea"></textarea>

  <button id="submitBtn" onclick="evaluateArgument()">Evaluate Logic</button>

  <div id="output">Evaluation results will appear here...</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }
    });

    async function evaluateArgument() {
      const apiKeyInput = document.getElementById('apiKey');
      const apiKey = apiKeyInput.value.trim();
      const opponentClaim = document.getElementById('opponentClaim').value;
      const steelman = document.getElementById('steelman').value;
      const critique = document.getElementById('critique').value;
      const betterIdea = document.getElementById('betterIdea').value;
      const outputDiv = document.getElementById('output');
      const submitBtn = document.getElementById('submitBtn');

      if (!apiKey) {
        alert('Please enter your Gemini API key.');
        return;
      }

      localStorage.setItem('gemini_key', apiKey);

      submitBtn.disabled = true;
      outputDiv.innerHTML = '<em>Analyzing argument structure...</em>';

      const promptText = `You are an expert logic and rhetoric evaluator. 
Analyze the user's submission across four distinct fields:
- Field 1 (Opponent's Claim): ${opponentClaim}
- Field 2 (Steelman): ${steelman}
- Field 3 (Critique): ${critique}
- Field 4 (Alternative Idea): ${betterIdea}

Evaluate whether:
1. Field 3 directly critiques Field 1 and 2, or if it commits logical fallacies like a Strawman or Red Herring.
2. Field 2 genuinely engages with the best version of the opponent's argument.
3. Field 4 provides a meaningful alternative addressing the flaw in Field 3.

Provide concise, direct feedback targeting logic integrity and fallacy detection.`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const data = await response.json();
        if (data.error) {
          outputDiv.innerHTML = '<strong>Error:</strong> ' + data.error.message;
        } else {
          const feedback = data.candidates[0].content.parts[0].text;
          outputDiv.innerHTML = marked.parse(feedback);
        }
      } catch (err) {
        outputDiv.innerHTML = '<strong>Request failed:</strong> ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
