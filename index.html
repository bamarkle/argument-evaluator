<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argument Logic Evaluator</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }

    .field-group {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    /* Form Field Group Colors Matched to Compiled Highlights */
    .group-f1  { background-color: #ffebe9; border-color: #fca5a5; } /* Red Tint */
    .group-f2  { background-color: #ebf8ff; border-color: #93c5fd; } /* Blue Tint */
    .group-f3a { background-color: #fffaf0; border-color: #fde047; } /* Light Orange Tint */
    .group-f3b { background-color: #fff4e6; border-color: #f97316; } /* Darker Orange Tint */
    .group-f4a { background-color: #f0fff4; border-color: #86efac; } /* Light Green Tint */
    .group-f4b { background-color: #dcfce7; border-color: #22c55e; } /* Darker Green Tint */
    .group-f5  { background-color: #faf5ff; border-color: #d8b4fe; } /* Purple Tint */
    .group-f6  { background-color: #f1f5f9; border-color: #cbd5e1; } /* Slate Tint */

    label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
      color: #1a202c;
    }

    .checkbox-label, .radio-label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #334155;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }

    .checkbox-label input, .radio-label input {
      width: auto;
      margin: 0;
    }

    textarea, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #ffffff;
    }

    textarea {
      height: 75px;
      resize: vertical;
    }

    /* Validation error state for missing fields */
    .input-error {
      border: 2px solid #dc2626 !important;
      background-color: #fef2f2 !important;
    }

    .sub-field {
      margin-top: 10px;
      padding-left: 15px;
      border-left: 3px solid rgba(0,0,0,0.15);
    }

    .hidden {
      display: none;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #submitBtn {
      background: #0066cc;
      color: #fff;
    }

    #compileBtn {
      background: #2b6cb0;
      color: #fff;
    }

    #resetBtn {
      background: #e2e8f0;
      color: #334155;
    }

    #copyBtn {
      background: #475569;
      color: #fff;
      font-size: 13px;
      padding: 6px 12px;
    }

    button:disabled {
      background: #999;
    }

    #output, #paragraphOutput {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    #output h1, #output h2, #output h3, #paragraphOutput h3 {
      margin-top: 0;
      color: #1a202c;
    }

    .disclaimer-box {
      background-color: #fffbeeb;
      border-left: 4px solid #f59e0b;
      padding: 12px 15px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #78350f;
      border-radius: 0 4px 4px 0;
    }

    #compiledParagraph {
      font-size: 16px;
      line-height: 1.8;
      background: #fff;
      padding: 18px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
    }

    /* Accessible High-Contrast Color Highlights */
    .hl-f1  { background-color: #ffebe9; color: #7d0000; padding: 2px 5px; border-radius: 3px; }
    .hl-f2  { background-color: #ebf8ff; color: #004b7a; padding: 2px 5px; border-radius: 3px; }
    .hl-f3a { background-color: #fffaf0; color: #7b4200; padding: 2px 5px; border-radius: 3px; }
    .hl-f3b { background-color: #fff4e6; color: #8a3b00; padding: 2px 5px; border-radius: 3px; }
    .hl-f4a { background-color: #f0fff4; color: #005a2b; padding: 2px 5px; border-radius: 3px; }
    .hl-f4b { background-color: #dcfce7; color: #004d20; padding: 2px 5px; border-radius: 3px; }
    .hl-f5  { background-color: #faf5ff; color: #4a007a; padding: 2px 5px; border-radius: 3px; }
    .hl-f6  { background-color: #f1f5f9; color: #1e293b; padding: 2px 5px; border-radius: 3px; }
  </style>
</head>
<body>

  <h1>Argument Logic Evaluator</h1>

  <!-- FIELD 1 GROUP (Red) -->
  <div class="field-group group-f1">
    <label for="opponentClaim">1. What argument is your opponent making?</label>
    <textarea id="opponentClaim" placeholder="e.g., making schools start later will allow students to get much needed rest"></textarea>

    <label class="checkbox-label">
      <input type="checkbox" id="isDirectQuote"> Is this a direct quote from your opponent?
    </label>

    <div class="sub-field">
      <label for="opponentAuthor">Opponent's / Author's Last Name:</label>
      <input type="text" id="opponentAuthor" placeholder="e.g., Smith" />
    </div>
  </div>

  <!-- FIELD 2 (Blue) -->
  <div class="field-group group-f2">
    <label for="steelman">2. Why is their argument strong or reasonable?</label>
    <textarea id="steelman" placeholder="e.g., students who get more sleep perform better academically and are safer drivers"></textarea>
  </div>

  <!-- FIELD 3a (Light Orange) -->
  <div class="field-group group-f3a">
    <label for="critique">3a. Where do you think their argument is flawed or missing something?</label>
    <textarea id="critique" placeholder="e.g., they ignore the practical schedule conflicts for working parents"></textarea>
  </div>

  <!-- FIELD 3b (Darker Orange) -->
  <div class="field-group group-f3b">
    <label for="critiqueWhy">3b. Why is that flaw a serious problem?</label>
    <textarea id="critiqueWhy" placeholder="e.g., working parents won't have an adult at home to help younger kids get ready or travel safely to school"></textarea>
  </div>

  <!-- FIELD 4a (Light Green) -->
  <div class="field-group group-f4a">
    <label for="alternative">4a. What alternative solution or idea addresses this issue?</label>
    <textarea id="alternative" placeholder="e.g., offering optional zero-period study halls or flexible start times rather than shifting the whole district clock"></textarea>
  </div>

  <!-- FIELD 4b (Darker Green) -->
  <div class="field-group group-f4b">
    <label for="alternativeWhy">4b. Why is your solution better?</label>
    <textarea id="alternativeWhy" placeholder="e.g., it gives sleep-deprived students flexibility without disrupting work routines for families"></textarea>
  </div>

  <!-- FIELD 5 GROUP - Supporting Research (Purple) -->
  <div class="field-group group-f5">
    <label for="supportingResearch">5. Supporting Research for Your Alternative Idea:</label>
    <textarea id="supportingResearch" placeholder="Summarize or quote evidence supporting your idea..."></textarea>

    <label class="checkbox-label">
      <input type="checkbox" id="isResearchDirectQuote"> Is this supporting evidence a direct quote?
    </label>

    <label style="margin-top: 12px;">Have you used this source before in this paper?</label>
    <div class="radio-group" id="radioGroupContainer">
      <label class="radio-label">
        <input type="radio" name="usedSourceBefore" value="yes"> Yes
      </label>
      <label class="radio-label">
        <input type="radio" name="usedSourceBefore" value="no"> No
      </label>
    </div>

    <!-- Conditional Field: YES -->
    <div id="sourceYesFields" class="hidden sub-field">
      <label for="supportingAuthorLastName">Supporting Research Author's Last Name:</label>
      <input type="text" id="supportingAuthorLastName" placeholder="e.g., Johnson" />
    </div>

    <!-- Conditional Fields: NO -->
    <div id="sourceNoFields" class="hidden sub-field">
      <label for="supportingAuthorFullName">Author's Full Name:</label>
      <input type="text" id="supportingAuthorFullName" placeholder="e.g., Dr. Sarah Johnson" />

      <label for="supportingAuthorCredentials">Author's Credentials:</label>
      <input type="text" id="supportingAuthorCredentials" placeholder="e.g., a professor at Penn State University" />
    </div>
  </div>

  <!-- FIELD 6 - Conclusion (Slate) -->
  <div class="field-group group-f6">
    <label for="conclusion">6. Conclusion / Final Takeaway:</label>
    <textarea id="conclusion" placeholder="e.g., flexible options solve student sleep needs without creating new headaches for working families"></textarea>
  </div>

  <div class="button-group">
    <button id="submitBtn" onclick="evaluateArgument()">Evaluate Logic</button>
    <button id="compileBtn" onclick="compileParagraph()">Compile Paragraph</button>
    <button id="resetBtn" onclick="resetForm()">Reset Form</button>
  </div>

  <div id="paragraphOutput" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h3 style="margin: 0;">Compiled Paragraph</h3>
      <button id="copyBtn" onclick="copyCompiledText()">Copy Text</button>
    </div>

    <div class="disclaimer-box">
      <strong>Important Note:</strong> This compiled text exists ONLY to show how your logic links together. It is an outline draft, not a finished paper. Do not copy and paste this into an essay without significant revision, editing, and smoothing out transitions.
    </div>

    <div id="compiledParagraph"></div>
  </div>

  <div id="output" class="hidden"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const radioButtons = document.querySelectorAll('input[name="usedSourceBefore"]');
      const yesFields = document.getElementById('sourceYesFields');
      const noFields = document.getElementById('sourceNoFields');

      radioButtons.forEach(radio => {
        radio.addEventListener('change', (e) => {
          if (e.target.value === 'yes') {
            yesFields.classList.remove('hidden');
            noFields.classList.add('hidden');
          } else if (e.target.value === 'no') {
            noFields.classList.remove('hidden');
            yesFields.classList.add('hidden');
          }
        });
      });
    });

    function cleanInputText(text) {
      if (!text) return "";
      let cleaned = text.trim();
      cleaned = cleaned.replace(/^(that|they argue that|this is because|however|but|because)\s+/i, '');
      return cleaned;
    }

    function clearValidationErrors() {
      const elements = document.querySelectorAll('.input-error');
      elements.forEach(el => el.classList.remove('input-error'));
    }

    function validateRequiredFields() {
      clearValidationErrors();
      let isValid = true;

      const requiredIds = [
        'opponentClaim',
        'opponentAuthor',
        'steelman',
        'critique',
        'critiqueWhy',
        'alternative',
        'alternativeWhy',
        'supportingResearch',
        'conclusion'
      ];

      requiredIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el.value.trim()) {
          el.classList.add('input-error');
          isValid = false;
        }
      });

      const usedSourceRadio = document.querySelector('input[name="usedSourceBefore"]:checked');
      if (!usedSourceRadio) {
        document.getElementById('radioGroupContainer').classList.add('input-error');
        isValid = false;
      } else if (usedSourceRadio.value === 'yes') {
        const lastName = document.getElementById('supportingAuthorLastName');
        if (!lastName.value.trim()) {
          lastName.classList.add('input-error');
          isValid = false;
        }
      } else if (usedSourceRadio.value === 'no') {
        const fullName = document.getElementById('supportingAuthorFullName');
        const creds = document.getElementById('supportingAuthorCredentials');
        if (!fullName.value.trim()) {
          fullName.classList.add('input-error');
          isValid = false;
        }
        if (!creds.value.trim()) {
          creds.classList.add('input-error');
          isValid = false;
        }
      }

      return isValid;
    }

    function compileParagraph() {
      if (!validateRequiredFields()) {
        alert('Please fill in all highlighted fields before compiling the paragraph.');
        return;
      }

      const opponentAuthor = document.getElementById('opponentAuthor').value.trim() || "The opponent";
      let opponentClaim = cleanInputText(document.getElementById('opponentClaim').value);
      const isDirectQuote = document.getElementById('isDirectQuote').checked;
      
      let steelman = cleanInputText(document.getElementById('steelman').value);
      let critique = cleanInputText(document.getElementById('critique').value);
      let critiqueWhy = cleanInputText(document.getElementById('critiqueWhy').value);
      let alternative = cleanInputText(document.getElementById('alternative').value);
      let alternativeWhy = cleanInputText(document.getElementById('alternativeWhy').value);
      
      let supportingResearch = cleanInputText(document.getElementById('supportingResearch').value);
      let conclusion = cleanInputText(document.getElementById('conclusion').value);

      const isResearchDirectQuote = document.getElementById('isResearchDirectQuote').checked;
      const usedSourceBefore = document.querySelector('input[name="usedSourceBefore"]:checked')?.value;
      
      const authorLastName = document.getElementById('supportingAuthorLastName').value.trim();
      const authorFullName = document.getElementById('supportingAuthorFullName').value.trim();
      const authorCreds = document.getElementById('supportingAuthorCredentials').value.trim();

      if (isDirectQuote && opponentClaim) {
        opponentClaim = `"${opponentClaim}"`;
      }
      if (isResearchDirectQuote && supportingResearch) {
        supportingResearch = `"${supportingResearch}"`;
      }

      let authorAttribution = "";
      if (usedSourceBefore === 'yes' && authorLastName) {
        authorAttribution = authorLastName;
      } else if (usedSourceBefore === 'no' && authorFullName) {
        authorAttribution = authorCreds ? `${authorFullName}, ${authorCreds},` : authorFullName;
      } else {
        authorAttribution = "researchers";
      }

      const htmlParagraph = `
        <span class="hl-f1">${opponentAuthor} argues that ${opponentClaim}</span>. 
        <span class="hl-f2">This is a reasonable argument because ${steelman}</span>. 
        <span class="hl-f3a">However, ${critique}</span>. 
        <span class="hl-f3b">This is a problem because ${critiqueWhy}</span>. 
        <span class="hl-f4a">An alternative solution is ${alternative}</span>. 
        <span class="hl-f4b">This solution is better because ${alternativeWhy}</span>. 
        <span class="hl-f5">According to ${authorAttribution}, ${supportingResearch}</span>. 
        <span class="hl-f6">Ultimately, ${conclusion}</span>.
      `;

      const paragraphContainer = document.getElementById('paragraphOutput');
      const paragraphBox = document.getElementById('compiledParagraph');
      
      paragraphBox.innerHTML = htmlParagraph;
      paragraphContainer.classList.remove('hidden');
      paragraphContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function copyCompiledText() {
      const paragraphBox = document.getElementById('compiledParagraph');
      navigator.clipboard.writeText(paragraphBox.innerText).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = 'Copied!';
        setTimeout(() => { copyBtn.innerText = 'Copy Text'; }, 2000);
      });
    }

    function resetForm() {
      if (confirm('Are you sure you want to reset all fields and clear the results?')) {
        const textareas = document.querySelectorAll('textarea');
        textareas.forEach(t => t.value = '');

        const textInputs = document.querySelectorAll('input[type="text"]');
        textInputs.forEach(i => i.value = '');

        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(c => c.checked = false);

        const radios = document.querySelectorAll('input[type="radio"]');
        radios.forEach(r => r.checked = false);

        document.getElementById('sourceYesFields').classList.add('hidden');
        document.getElementById('sourceNoFields').classList.add('hidden');

        document.getElementById('paragraphOutput').classList.add('hidden');
        document.getElementById('output').classList.add('hidden');
        document.getElementById('compiledParagraph').innerHTML = '';
        document.getElementById('output').innerHTML = '';

        clearValidationErrors();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    async function evaluateArgument() {
      if (!validateRequiredFields()) {
        alert('Please fill in all highlighted fields before running the evaluation.');
        return;
      }

      const outputDiv = document.getElementById('output');
      const submitBtn = document.getElementById('submitBtn');

      // Package field inputs to send to the backend
      const payload = {
        opponentClaim: document.getElementById('opponentClaim').value,
        steelman: document.getElementById('steelman').value,
        critique: document.getElementById('critique').value,
        critiqueWhy: document.getElementById('critiqueWhy').value,
        alternative: document.getElementById('alternative').value,
        alternativeWhy: document.getElementById('alternativeWhy').value
      };

      submitBtn.disabled = true;
      outputDiv.classList.remove('hidden');
      outputDiv.innerHTML = '<em>Analyzing argument structure...</em>';

      try {
        const response = await fetch('/api/evaluate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Server returned ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        // Handle response from server (supports raw text string, parsed markdown, or json property)
        const feedback = data.result || data.evaluation || data.feedback || data;
        outputDiv.innerHTML = marked.parse(feedback);

      } catch (err) {
        outputDiv.innerHTML = '<strong>Request failed:</strong> ' + err.message;
      } finally {
        submitBtn.disabled = false;
        outputDiv.scrollIntoView({ behavior: 'smooth' });
      }
    }
  </script>
</body>
</html>
