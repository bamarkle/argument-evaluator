<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argument Logic Evaluator</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }

    .field-group {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid transparent;
    }

    /* Form Field Group Colors Matched to Compiled Highlights */
    .group-f1 { background-color: #ffebe9; border-color: #fca5a5; } /* Red Tint */
    .group-f2 { background-color: #ebf8ff; border-color: #93c5fd; } /* Blue Tint */
    .group-f3 { background-color: #fffaf0; border-color: #fde047; } /* Orange/Yellow Tint */
    .group-f4 { background-color: #f0fff4; border-color: #86efac; } /* Green Tint */
    .group-f5 { background-color: #faf5ff; border-color: #d8b4fe; } /* Purple Tint */
    .group-f6 { background-color: #f1f5f9; border-color: #cbd5e1; } /* Slate Tint */

    label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
      color: #1a202c;
    }

    .checkbox-label, .radio-label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #334155;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }

    .checkbox-label input, .radio-label input {
      width: auto;
      margin: 0;
    }

    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #ffffff;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    .sub-field {
      margin-top: 10px;
      padding-left: 15px;
      border-left: 3px solid rgba(0,0,0,0.15);
    }

    .hidden {
      display: none;
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #submitBtn {
      background: #0066cc;
      color: #fff;
    }

    #compileBtn {
      background: #2b6cb0;
      color: #fff;
    }

    button:disabled {
      background: #999;
    }

    #output, #paragraphOutput {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    #output h1, #output h2, #output h3, #paragraphOutput h3 {
      margin-top: 0;
      color: #1a202c;
    }

    #compiledParagraph {
      font-size: 16px;
      line-height: 1.8;
      background: #fff;
      padding: 18px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
    }

    /* Accessible ADA High-Contrast Color Palette */
    .hl-f1 { background-color: #ffebe9; color: #7d0000; padding: 2px 5px; border-radius: 3px; }
    .hl-f2 { background-color: #ebf8ff; color: #004b7a; padding: 2px 5px; border-radius: 3px; }
    .hl-f3 { background-color: #fffaf0; color: #7b4200; padding: 2px 5px; border-radius: 3px; }
    .hl-f4 { background-color: #f0fff4; color: #005a2b; padding: 2px 5px; border-radius: 3px; }
    .hl-f5 { background-color: #faf5ff; color: #4a007a; padding: 2px 5px; border-radius: 3px; }
    .hl-f6 { background-color: #f1f5f9; color: #1e293b; padding: 2px 5px; border-radius: 3px; }
  </style>
</head>
<body>

  <h1>Argument Logic Evaluator</h1>

  <div style="margin-bottom: 20px;">
    <label for="apiKey">Gemini API Key (saved locally):</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." />
  </div>

  <!-- FIELD 1 GROUP (Red) -->
  <div class="field-group group-f1">
    <label for="opponentClaim">1. What argument is your opponent making?</label>
    <textarea id="opponentClaim" placeholder="e.g., making schools start later will allow students to get much needed rest"></textarea>

    <label class="checkbox-label">
      <input type="checkbox" id="isDirectQuote"> Is this a direct quote from your opponent?
    </label>

    <div class="sub-field">
      <label for="opponentAuthor">Opponent's / Author's Last Name:</label>
      <input type="text" id="opponentAuthor" placeholder="e.g., Smith" />
    </div>
  </div>

  <!-- FIELD 2 (Blue) -->
  <div class="field-group group-f2">
    <label for="steelman">2. Why is their argument strong or reasonable?</label>
    <textarea id="steelman" placeholder="e.g., students who get more sleep perform better academically and are safer drivers"></textarea>
  </div>

  <!-- FIELD 3 (Orange) -->
  <div class="field-group group-f3">
    <label for="critique">3. Where do you think their argument is flawed?</label>
    <textarea id="critique" placeholder="e.g., they ignore the practical schedule conflicts for working parents"></textarea>
  </div>

  <!-- FIELD 4 GROUP (Green) -->
  <div class="field-group group-f4">
    <label for="betterIdea">4. Why is your alternative idea better?</label>
    <textarea id="betterIdea" placeholder="e.g., offering optional zero-period study halls rather than shifting the entire district clock"></textarea>
  </div>

  <!-- FIELD 5 GROUP - Supporting Research (Purple) -->
  <div class="field-group group-f5">
    <label for="supportingResearch">5. Supporting Research for Your Alternative Idea:</label>
    <textarea id="supportingResearch" placeholder="Summarize or quote evidence supporting your idea..."></textarea>

    <label class="checkbox-label">
      <input type="checkbox" id="isResearchDirectQuote"> Is this supporting evidence a direct quote?
    </label>

    <label style="margin-top: 12px;">Have you used this source before in this paper?</label>
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="usedSourceBefore" value="yes"> Yes
      </label>
      <label class="radio-label">
        <input type="radio" name="usedSourceBefore" value="no"> No
      </label>
    </div>

    <!-- Conditional Field: YES -->
    <div id="sourceYesFields" class="hidden sub-field">
      <label for="supportingAuthorLastName">Supporting Research Author's Last Name:</label>
      <input type="text" id="supportingAuthorLastName" placeholder="e.g., Johnson" />
    </div>

    <!-- Conditional Fields: NO -->
    <div id="sourceNoFields" class="hidden sub-field">
      <label for="supportingAuthorFullName">Author's Full Name:</label>
      <input type="text" id="supportingAuthorFullName" placeholder="e.g., Dr. Sarah Johnson" />

      <label for="supportingAuthorCredentials">Author's Credentials:</label>
      <input type="text" id="supportingAuthorCredentials" placeholder="e.g., a professor at Penn State University" />
    </div>
  </div>

  <!-- FIELD 6 - Conclusion (Slate) -->
  <div class="field-group group-f6">
    <label for="conclusion">6. Conclusion / Final Takeaway:</label>
    <textarea id="conclusion" placeholder="e.g., flexible options solve student sleep needs without disrupting family routines"></textarea>
  </div>

  <div class="button-group">
    <button id="submitBtn" onclick="evaluateArgument()">Evaluate Logic</button>
    <button id="compileBtn" onclick="compileParagraph()">Compile Paragraph</button>
  </div>

  <div id="paragraphOutput" class="hidden">
    <h3>Compiled Paragraph</h3>
    <div id="compiledParagraph"></div>
  </div>

  <div id="output">Evaluation results will appear here...</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }

      const radioButtons = document.querySelectorAll('input[name="usedSourceBefore"]');
      const yesFields = document.getElementById('sourceYesFields');
      const noFields = document.getElementById('sourceNoFields');

      radioButtons.forEach(radio => {
        radio.addEventListener('change', (e) => {
          if (e.target.value === 'yes') {
            yesFields.classList.remove('hidden');
            noFields.classList.add('hidden');
          } else if (e.target.value === 'no') {
            noFields.classList.remove('hidden');
            yesFields.classList.add('hidden');
          }
        });
      });
    });

    // Clean leading duplicate transition words typed by students
    function cleanInputText(text) {
      if (!text) return "";
      let cleaned = text.trim();
      // Remove starting capitalization if sentence is plugged into mid-sentence template
      cleaned = cleaned.replace(/^(that|they argue that|this is because|however|but)\s+/i, '');
      return cleaned;
    }

    function compileParagraph() {
      const opponentAuthor = document.getElementById('opponentAuthor').value.trim() || "The opponent";
      let opponentClaim = cleanInputText(document.getElementById('opponentClaim').value);
      const isDirectQuote = document.getElementById('isDirectQuote').checked;
      
      let steelman = cleanInputText(document.getElementById('steelman').value);
      let critique = cleanInputText(document.getElementById('critique').value);
      let betterIdea = cleanInputText(document.getElementById('betterIdea').value);
      let supportingResearch = cleanInputText(document.getElementById('supportingResearch').value);
      let conclusion = cleanInputText(document.getElementById('conclusion').value);

      const isResearchDirectQuote = document.getElementById('isResearchDirectQuote').checked;
      const usedSourceBefore = document.querySelector('input[name="usedSourceBefore"]:checked')?.value;
      
      const authorLastName = document.getElementById('supportingAuthorLastName').value.trim();
      const authorFullName = document.getElementById('supportingAuthorFullName').value.trim();
      const authorCreds = document.getElementById('supportingAuthorCredentials').value.trim();

      if (isDirectQuote && opponentClaim) {
        opponentClaim = `"${opponentClaim}"`;
      }
      if (isResearchDirectQuote && supportingResearch) {
        supportingResearch = `"${supportingResearch}"`;
      }

      let authorAttribution = "";
      if (usedSourceBefore === 'yes' && authorLastName) {
        authorAttribution = authorLastName;
      } else if (usedSourceBefore === 'no' && authorFullName) {
        authorAttribution = authorCreds ? `${authorFullName}, ${authorCreds},` : authorFullName;
      } else {
        authorAttribution = "researchers";
      }

      const htmlParagraph = `
        <span class="hl-f1">${opponentAuthor} argues that ${opponentClaim || "[Field 1]"}</span>. 
        <span class="hl-f2">This is a reasonable argument because ${steelman || "[Field 2]"}</span>. 
        <span class="hl-f3">However, ${critique || "[Field 3]"}</span>. 
        <span class="hl-f4">An alternative might be ${betterIdea || "[Field 4]"}</span>. 
        <span class="hl-f5">According to ${authorAttribution}, ${supportingResearch || "[Supporting Research]"}</span>. 
        <span class="hl-f6">Ultimately, ${conclusion || "[Conclusion]"}</span>.
      `;

      const paragraphContainer = document.getElementById('paragraphOutput');
      const paragraphBox = document.getElementById('compiledParagraph');
      
      paragraphBox.innerHTML = htmlParagraph;
      paragraphContainer.classList.remove('hidden');
      paragraphContainer.scrollIntoView({ behavior: 'smooth' });
    }

    async function evaluateArgument() {
      const apiKeyInput = document.getElementById('apiKey');
      const apiKey = apiKeyInput.value.trim();
      
      const opponentClaim = document.getElementById('opponentClaim').value;
      const steelman = document.getElementById('steelman').value;
      const critique = document.getElementById('critique').value;
      const betterIdea = document.getElementById('betterIdea').value;

      const outputDiv = document.getElementById('output');
      const submitBtn = document.getElementById('submitBtn');

      if (!apiKey) {
        alert('Please enter your Gemini API key.');
        return;
      }

      localStorage.setItem('gemini_key', apiKey);

      submitBtn.disabled = true;
      outputDiv.innerHTML = '<em>Analyzing argument structure...</em>';

      const promptText = `You are a helpful, encouraging writing and logic coach evaluating a student's argument breakdown.

Use clear, simple language appropriate for a middle or high school reader. Avoid overly dense academic jargon (if you mention a logical fallacy, explain it simply without using Latin terms).

Analyze the student's four inputs:
- Field 1 (Opponent's Claim): ${opponentClaim}
- Field 2 (Steelman): ${steelman}
- Field 3 (Critique): ${critique}
- Field 4 (Alternative Idea): ${betterIdea}

You MUST follow this exact formatting structure for your response every single time:

### 1. Opponent's Claim & Steelman Check
* **Engagement:** [Is Field 2 a fair and strong representation of Field 1? Answer in 1-2 sentences.]
* **Feedback:** 
  - **What's working / What's wrong:** [Explain clearly]
  - **Why it matters:** [Explain why steelmanning fairly builds stronger arguments]
  - **How to fix it:** [Provide a concrete example of how to improve or polish it]

### 2. Critique & Logic Check
* **Direct Hit or Sidestep?:** [Does Field 3 directly address the point in Fields 1 & 2, or does it shift topics/commit a fallacy like a Strawman or Red Herring?]
* **Feedback:**
  - **What's working / What's wrong:** [Explain clearly]
  - **Why it matters:** [Explain why sidestepping or using a weak critique weakens their position]
  - **How to fix it:** [Provide a concrete example or sample sentence showing how to directly attack the opponent's logic]

### 3. Alternative Idea Check
* **Is it a Real Alternative?:** [Does Field 4 offer a constructive solution or new idea that addresses the flaw in Field 3, or does it just repeat Field 3 / defend keeping things the same?]
* **Feedback:**
  - **What's working / What's wrong:** [Explain clearly]
  - **Why it matters:** [Explain why a strong counter-idea needs to solve the problem]
  - **How to fix it:** [Provide a concrete example of what a better alternative idea would look like here]`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const data = await response.json();
        if (data.error) {
          outputDiv.innerHTML = '<strong>Error:</strong> ' + data.error.message;
        } else {
          const feedback = data.candidates[0].content.parts[0].text;
          outputDiv.innerHTML = marked.parse(feedback);
        }
      } catch (err) {
        outputDiv.innerHTML = '<strong>Request failed:</strong> ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
